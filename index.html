<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARGENTO PRO ARK</title>
<meta name="description" content="Servers argentinos de ARK: elegí ARK ASA o ARK ASE.">
<style>
  :root { --bg:#0b0f14; --fg:#f4f6f8; --muted:#aab4bf; }
  * { box-sizing:border-box; margin:0; }
  html,body { min-height:100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:var(--fg); background:var(--bg) url("asa/img/fondo.jpg") center/cover fixed no-repeat;
    display:flex; align-items:center; justify-content:center; padding:24px 16px;
  }
  body::before { content:""; position:fixed; inset:0; background:linear-gradient(180deg,rgba(5,8,12,.72),rgba(5,8,12,.88)); z-index:0; }
  main { position:relative; z-index:1; width:100%; max-width:520px; text-align:center; }
  h1 { font-size:clamp(34px,9vw,58px); line-height:1.05; font-weight:900; letter-spacing:.04em; }
  h1 span:nth-child(1){color:#5ab4ff} h1 span:nth-child(2){color:#ffd23f} h1 span:nth-child(3){color:#ff5a7a} h1 span:nth-child(4){color:#5dff9d}
  .sub { color:var(--muted); margin:10px 0 34px; font-size:16px; }
  .btn {
    display:block; text-decoration:none; color:#fff; font-weight:800; font-size:clamp(22px,6vw,30px);
    padding:22px 18px; border-radius:16px; margin-top:16px; letter-spacing:.06em;
    box-shadow:0 8px 28px rgba(0,0,0,.45); transition:transform .12s, filter .12s;
  }
  .btn small { display:block; font-weight:500; font-size:14px; letter-spacing:0; opacity:.92; margin-top:6px; }
  .btn:hover,.btn:focus-visible { transform:translateY(-3px); filter:brightness(1.12); outline:none; }
  .asa { background:linear-gradient(135deg,#1f7bff,#7b3bff); }
  .ase { background:linear-gradient(135deg,#ff8a1f,#e23b3b); }
  footer { margin-top:30px; color:var(--muted); font-size:13px; }
  footer a { color:#cfd8e3; }
</style>
</head>
<body>
<main>
  <h1><span>ARGENTO</span> <span>PRO</span> <span>ARK</span></h1>
  <p class="sub">Elegí a cuál de los dos servers jugás</p>
  <a class="btn asa" href="asa/">ARK ASA<small>Ark Survival Ascended · mapa Ragnarok</small></a>
  <a class="btn ase" href="ase.html">ARK ASE<small>Ark Survival Evolved · cluster de 5 mapas</small></a>
  <footer>Discord: <a href="https://discord.gg/2EqEE46DjW">discord.gg/2EqEE46DjW</a></footer>
</main>
</body>
</html>
